[workspace]
resolver = "2"
members = [
    "crates/next-gui-platform",
    "crates/next-gui-scene",
    "crates/next-gui-render",
    "crates/next-gui-render-soft",
    "crates/next-gui-render-gpu",
    "crates/next-gui-layout",
    "crates/next-gui-ui",
    "crates/next-gui-text",
    "examples/01_soft_window",
    "examples/02_counter",
    "examples/03_ngui_counter",
    "examples/04_cjk_text",
    "examples/05_backend_toggle",
    "examples/10_office_panel",
    "examples/11_office_shell",
    "examples/12_office_inputs",
    "examples/13_office_data",
    "examples/14_office_nav",
    "examples/15_office_feedback",
    "examples/20_office_industrial",
    "examples/21_office_p1_rest",
    "examples/22_office_p1_deferred",
    "examples/23_office_charts",
    "crates/next-gui-profile",
    "crates/next-gui-immediate",
    "examples/24_profile_dual",
    "examples/25_immediate_viewport",
    "examples/26_office_p2",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xrdavies/next-gui"

[workspace.dependencies]
next-gui-platform = { path = "crates/next-gui-platform" }
next-gui-scene = { path = "crates/next-gui-scene" }
next-gui-render = { path = "crates/next-gui-render" }
next-gui-render-soft = { path = "crates/next-gui-render-soft" }
next-gui-render-gpu = { path = "crates/next-gui-render-gpu" }
next-gui-layout = { path = "crates/next-gui-layout" }
next-gui-ui = { path = "crates/next-gui-ui" }
next-gui-text = { path = "crates/next-gui-text" }
next-gui-profile = { path = "crates/next-gui-profile" }
next-gui-immediate = { path = "crates/next-gui-immediate" }
winit = { version = "0.30", default-features = true }
softbuffer = "0.4"
arboard = { version = "3", default-features = false }
