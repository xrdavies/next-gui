[package]
name = "next-gui-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windowing, input, and frame present abstraction for next-gui"

[features]
default = ["linux"]
linux = ["dep:winit", "dep:softbuffer", "dep:arboard", "dep:image"]
# Enables the macOS backend on any host for compile-check; the real windowing path is target_os = "macos".
macos = ["dep:winit", "dep:softbuffer", "dep:arboard", "dep:image"]
# Enables the Windows backend on any host for compile-check; the real windowing path is target_os = "windows".
windows = ["dep:winit", "dep:softbuffer", "dep:arboard", "dep:image"]

[dependencies]
winit = { workspace = true, optional = true }
softbuffer = { workspace = true, optional = true }
arboard = { workspace = true, optional = true, default-features = false, features = ["image-data"] }
# shortcut: pin arboard's image version for Rust 1.86; relax when the workspace MSRV advances.
image = { version = "=0.25.8", default-features = false, optional = true }
next-gui-scene = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
