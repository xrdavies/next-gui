[package]
name = "e28_db_browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "DB Browser for SQLite–style example (rusqlite + next-gui Theme, DB4S parity)"

[[bin]]
name = "e28_db_browser"
path = "src/main.rs"

[dependencies]
next-gui-platform = { workspace = true }
next-gui-scene = { workspace = true }
next-gui-render = { workspace = true }
next-gui-render-soft = { workspace = true }
next-gui-render-gpu = { workspace = true }
next-gui-ui = { workspace = true }
next-gui-text = { workspace = true }
next-gui-layout = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "hooks", "load_extension", "backup", "functions"] }
rfd = "0.13.0"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }

tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.41"
pcre2 = "0.2.11"
